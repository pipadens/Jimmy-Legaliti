<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Legaliti - Asistente & Copiloto</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <main class="container">
        <div class="logo-container">
            <img src="1000103317.png" alt="Jimmy Legaliti Logo" class="app-logo">
        </div>

        <h1>Jimmy Legaliti</h1>
        <p class="subtitle">Asistente Legal & Ojo Artificial para Conducir</p>
        
        <div class="button-group">
            <button id="toggleCamBtn" class="btn primary">📷 Encender Cámara</button>
            <button id="voiceCommandBtn" class="btn secondary">🎙️ Comando de Voz</button>
        </div>
     
        <div id="legalSection">
            <div class="pdf-upload-box">
                <label for="pdfInput" class="btn file-btn">📁 Subir Archivo PDF</label>
                <input type="file" id="pdfInput" accept=".pdf" style="display: none;">
            </div>

            <textarea id="textInput" placeholder="O escribe/pega el texto aquí..."></textarea>

            <div class="button-group">
                <button id="speakBtn" class="btn primary">🔊 Leer en Voz Alta</button>
                <button id="stopBtn" class="btn danger">⏹️ Detener</button>
                <button id="micBtn" class="btn secondary">🎙️ Dictar por Voz</button>
                <button id="clearBtn" class="btn warning">🗑️ Borrar</button>
            </div>
        </div>

        <div id="driveSection" style="display: none;">
            <div class="drive-container">
                <h2>Modo Copiloto Activo</h2>
                <p class="drive-instruction">Di tus notas o usa la cámara como apoyo visual.</p>
                
                <video id="cameraStream" autoplay playsinline></video>

                <div class="button-group">
                    <button id="startCamBtn" class="btn primary">📷 Encender Cámara</button>
                    <button id="driveVoiceBtn" class="btn secondary">🎙️ Comando de Voz</button>
                    <button id="backToLegalBtn" class="btn warning">⬅️ Volver a Legal</button>
                </div>
            </div>
        </div>
        
        <p id="status" class="status-text"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
